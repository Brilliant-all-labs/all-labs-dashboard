<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>all_labs 대시보드</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --serif: "Noto Serif KR", "Noto Serif CJK KR", serif;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", "Malgun Gothic", "Noto Sans KR", sans-serif;

    --accent: #04342C;
    --accent-tint: rgba(4, 52, 44, 0.07);
    --accent-tint-strong: rgba(4, 52, 44, 0.16);

    --bg: #faf8f3;
    --fg: #1c1c1a;
    --fg-muted: #7c7c74;
    --fg-faint: #a3a39a;
    --line: rgba(28, 28, 26, 0.11);

    --down-fg: #8a4a46;
    --down-bg: rgba(138, 74, 70, 0.08);

    --neutral-fg: #7c7c74;
    --neutral-bg: rgba(28, 28, 26, 0.05);

    --pending-fg: #8a5a00;
    --pending-bg: rgba(138, 90, 0, 0.09);

    --flag-fg: #8a2f2f;
    --flag-bg: rgba(138, 47, 47, 0.08);
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    padding: 0;
    background: var(--bg);
    color: var(--fg);
    font-family: var(--sans);
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
  }

  .page {
    max-width: 720px;
    margin: 0 auto;
    padding: 40px 20px 72px;
  }

  header.top {
    border-bottom: 1px solid var(--accent);
    padding-bottom: 22px;
    margin-bottom: 36px;
  }

  header.top h1 {
    font-family: var(--serif);
    font-size: 2rem;
    font-weight: 700;
    letter-spacing: -0.01em;
    margin: 0 0 12px;
    color: var(--accent);
  }

  .meta-row {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 8px 14px;
    font-size: 0.8rem;
    color: var(--fg-muted);
  }

  .live-dot {
    display: inline-block;
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--accent);
    margin-right: 6px;
    animation: pulse 1.8s ease-in-out infinite;
    vertical-align: middle;
  }

  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.3; }
  }

  section {
    margin-bottom: 48px;
  }

  section h2 {
    font-family: var(--serif);
    font-size: 1.25rem;
    font-weight: 700;
    margin: 0 0 6px;
    color: var(--accent);
  }

  section .section-sub {
    font-size: 0.78rem;
    color: var(--fg-muted);
    margin: 0 0 20px;
  }

  /* Shared pill / label language ------------------------------------- */

  .pill {
    display: inline-block;
    font-family: var(--sans);
    font-size: 0.72rem;
    font-weight: 600;
    padding: 2px 10px;
    border-radius: 999px;
    white-space: nowrap;
  }

  .pill-accent  { background: var(--accent-tint); color: var(--accent); }
  .pill-down    { background: var(--down-bg); color: var(--down-fg); }
  .pill-neutral { background: var(--neutral-bg); color: var(--neutral-fg); }
  .pill-warn    { background: var(--pending-bg); color: var(--pending-fg); }

  .flag-pill {
    display: inline-block;
    font-family: var(--sans);
    font-size: 0.72rem;
    font-weight: 700;
    padding: 2px 10px;
    border-radius: 999px;
    background: var(--flag-bg);
    color: var(--flag-fg);
  }

  .source-label {
    font-size: 0.72rem;
    color: var(--fg-faint);
    letter-spacing: 0.03em;
  }

  /* Trend list --------------------------------------------------------- */

  .trend-list {
    display: flex;
    flex-direction: column;
  }

  .trend-row {
    padding: 18px 0;
    border-bottom: 1px solid var(--line);
  }

  .trend-row:first-child { padding-top: 4px; }
  .trend-row:last-child { border-bottom: none; }

  .row-main {
    display: flex;
    flex-wrap: wrap;
    align-items: baseline;
    gap: 6px 10px;
    margin-bottom: 6px;
  }

  .row-keyword {
    font-size: 1.05rem;
    font-weight: 700;
    color: var(--fg);
  }

  .row-sub {
    display: flex;
    flex-wrap: wrap;
    align-items: baseline;
    gap: 4px 10px;
    font-size: 0.83rem;
    color: var(--fg-muted);
  }

  .row-sub b { color: var(--fg); font-weight: 600; }

  .row-sub .sep { color: var(--fg-faint); }

  .row-sub .row-news { color: var(--fg-muted); }

  .row-sub .row-time { color: var(--fg-faint); font-size: 0.76rem; }

  .row-flag-line {
    margin: 6px 0 2px;
  }

  /* Blog status table ---------------------------------------------------- */

  .table-wrap {
    overflow-x: auto;
  }

  table.blog-table {
    width: 100%;
    min-width: 460px;
    border-collapse: collapse;
    font-family: var(--sans);
    font-size: 0.83rem;
  }

  table.blog-table th,
  table.blog-table td {
    padding: 10px 14px 10px 0;
    text-align: left;
    border-bottom: 1px solid var(--line);
    vertical-align: top;
  }

  table.blog-table thead th {
    color: var(--fg-muted);
    font-weight: 600;
    font-size: 0.72rem;
    white-space: nowrap;
    border-bottom: 1px solid var(--accent);
  }

  table.blog-table tbody tr:last-child td {
    border-bottom: none;
  }

  table.blog-table tbody tr.status-row-pending td {
    background: var(--pending-bg);
  }

  table.blog-table tbody tr.status-row-pending td:first-child {
    box-shadow: inset 2px 0 0 var(--pending-fg);
  }

  .empty-state, .error-state {
    padding: 28px 0;
    text-align: center;
    color: var(--fg-muted);
    font-size: 0.85rem;
    border-bottom: 1px solid var(--line);
  }

  .error-state { color: var(--down-fg); }

  footer {
    text-align: center;
    font-size: 0.7rem;
    color: var(--fg-faint);
    padding-top: 20px;
    border-top: 1px solid var(--line);
  }

  @media (min-width: 768px) {
    .page {
      max-width: 1120px;
      padding: 56px 32px 80px;
    }

    header.top h1 {
      font-size: 2.3rem;
    }

    .main-grid {
      display: grid;
      grid-template-columns: 2fr 1fr;
      align-items: start;
      gap: 0 56px;
    }

    .main-grid section {
      margin-bottom: 0;
    }
  }
</style>
</head>
<body>
<div class="page">

  <header class="top">
    <h1>all_labs 대시보드</h1>
    <div class="meta-row">
      <span><span class="live-dot"></span><span id="refresh-label">30초마다 갱신 중</span></span>
      <span>마지막 갱신: <strong id="last-updated">-</strong></span>
    </div>
  </header>

  <div class="main-grid">

    <section id="trend-section">
      <h2>트렌드 체커</h2>
      <p class="section-sub">수집시각 최신순 · 데이터랩추세 상승세는 강조 표시됩니다</p>
      <div id="trend-cards" class="trend-list">
        <div class="empty-state">불러오는 중...</div>
      </div>
    </section>

    <section id="blog-section">
      <h2>블로그 발행 현황</h2>
      <p class="section-sub">날짜 최신순 · 발행완료는 옅게, 검수 대기는 강조 표시됩니다</p>
      <div id="blog-content">
        <div class="empty-state">불러오는 중...</div>
      </div>
    </section>

  </div>

  <footer>all_labs internal dashboard</footer>

</div>

<script>
(function () {
  "use strict";

  // ---------------------------------------------------------------------
  // Config
  // ---------------------------------------------------------------------
  // Public read-only Google Sheet (via "파일 → 공유 → 웹에 게시").
  // No credentials involved: this is a client-side fetch of a published
  // gviz JSON endpoint.
  var CONFIG = {
    SHEET_ID: "12MW8UkLTqWtvbQXHkLe3-Tv1s5zHIfjaZmL2x161ZTs",
    TREND_SHEET_NAME: "Sheet1",
    BLOG_SHEET_NAME: "블로그현황",
    USE_DUMMY_DATA: false,
    REFRESH_MS: 30000
  };

  function gvizUrl(sheetName) {
    return "https://docs.google.com/spreadsheets/d/" + CONFIG.SHEET_ID +
      "/gviz/tq?tqx=out:json&headers=1&sheet=" + encodeURIComponent(sheetName);
  }

  // ---------------------------------------------------------------------
  // Dummy data (used until the real sheet is published)
  // ---------------------------------------------------------------------
  function getDummyRows() {
    return [
      {
        collectedAt: "2026-09-08 14:20",
        keyword: "제주도 가을 여행",
        source: "google",
        trend: "상승세",
        competition: 128,
        news: "제주 단풍 명소 특집 기사 다수"
      },
      {
        collectedAt: "2026-09-08 14:20",
        keyword: "실종 고양이 찾기",
        source: "daum",
        trend: "상승세",
        competition: 34,
        news: "주의: 실종 - 관련 실종 사건 보도 확인됨"
      },
      {
        collectedAt: "2026-09-08 13:55",
        keyword: "에어프라이어 レシピ",
        source: "google",
        trend: "보통",
        competition: 512,
        news: "특이 이슈 없음"
      },
      {
        collectedAt: "2026-09-08 13:55",
        keyword: "전기차 보조금 2026",
        source: "daum",
        trend: "하락세",
        competition: 76,
        news: "정부 정책 발표 관련 기사"
      },
      {
        collectedAt: "2026-09-08 13:30",
        keyword: "홈트레이닝 루틴",
        source: "google",
        trend: "상승세",
        competition: 210,
        news: "특이 이슈 없음"
      }
    ];
  }

  // ---------------------------------------------------------------------
  // gviz JSON parsing
  // ---------------------------------------------------------------------
  function parseGvizTable(text) {
    var match = text.match(/google\.visualization\.Query\.setResponse\(([\s\S]*)\);?\s*$/);
    if (!match) throw new Error("gviz 응답 형식을 해석할 수 없습니다");
    var json = JSON.parse(match[1]);
    var cols = json.table.cols.map(function (c) { return (c.label || "").trim(); });
    return { cols: cols, rows: json.table.rows || [] };
  }

  function gvizColIndex(cols, keyword) {
    for (var i = 0; i < cols.length; i++) {
      if (cols[i].indexOf(keyword) !== -1) return i;
    }
    return -1;
  }

  function gvizCellText(cell) {
    if (!cell) return "";
    return (cell.f !== undefined ? cell.f : cell.v) || "";
  }

  function fetchGvizSheet(sheetName) {
    return fetch(gvizUrl(sheetName), { cache: "no-store" })
      .then(function (res) {
        if (!res.ok) throw new Error("HTTP " + res.status);
        return res.text();
      })
      .then(parseGvizTable);
  }

  function parseTrendTable(table) {
    var idx = {
      collectedAt: gvizColIndex(table.cols, "수집시각"),
      keyword: gvizColIndex(table.cols, "키워드"),
      source: gvizColIndex(table.cols, "소스"),
      trend: gvizColIndex(table.cols, "데이터랩"),
      competition: gvizColIndex(table.cols, "문서수"),
      news: gvizColIndex(table.cols, "관련뉴스")
    };

    return table.rows.map(function (row) {
      var c = row.c;
      return {
        collectedAt: String(gvizCellText(c[idx.collectedAt])),
        keyword: String(gvizCellText(c[idx.keyword])),
        source: String(gvizCellText(c[idx.source])).toLowerCase(),
        trend: String(gvizCellText(c[idx.trend])),
        competition: gvizCellText(c[idx.competition]),
        news: String(gvizCellText(c[idx.news]))
      };
    });
  }

  function parseBlogTable(table) {
    var idx = {
      date: gvizColIndex(table.cols, "날짜"),
      category: gvizColIndex(table.cols, "카테고리"),
      topic: gvizColIndex(table.cols, "소재"),
      status: gvizColIndex(table.cols, "상태"),
      note: gvizColIndex(table.cols, "비고")
    };

    return table.rows.map(function (row) {
      var c = row.c;
      return {
        date: String(gvizCellText(c[idx.date])),
        category: String(gvizCellText(c[idx.category])),
        topic: String(gvizCellText(c[idx.topic])),
        status: String(gvizCellText(c[idx.status])),
        note: String(gvizCellText(c[idx.note]))
      };
    });
  }

  function fetchTrendRows() {
    if (CONFIG.USE_DUMMY_DATA) {
      return Promise.resolve(getDummyRows());
    }
    return fetchGvizSheet(CONFIG.TREND_SHEET_NAME).then(parseTrendTable);
  }

  function fetchBlogRows() {
    return fetchGvizSheet(CONFIG.BLOG_SHEET_NAME).then(parseBlogTable);
  }

  // ---------------------------------------------------------------------
  // Rendering
  // ---------------------------------------------------------------------
  function trendPillClass(trend) {
    if (trend.indexOf("상승") !== -1) return "pill-accent";
    if (trend.indexOf("하강") !== -1 || trend.indexOf("하락") !== -1) return "pill-down";
    return "pill-neutral";
  }

  function ethicsFlag(news) {
    var m = news.match(/주의\s*:\s*[^\s,]+/);
    return m ? m[0] : null;
  }

  function sourceLabel(source) {
    if (source.indexOf("daum") !== -1 || source.indexOf("다음") !== -1) {
      return "다음";
    }
    return "구글";
  }

  function escapeHtml(str) {
    return String(str)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;");
  }

  function parseTimestamp(str) {
    var t = Date.parse(str.replace(" ", "T"));
    return isNaN(t) ? 0 : t;
  }

  function renderTrendRows(rows) {
    var container = document.getElementById("trend-cards");

    if (!rows || rows.length === 0) {
      container.innerHTML = '<div class="empty-state">표시할 데이터가 없습니다</div>';
      return;
    }

    var sorted = rows.slice().sort(function (a, b) {
      return parseTimestamp(b.collectedAt) - parseTimestamp(a.collectedAt);
    });

    container.innerHTML = sorted.map(function (row) {
      var up = row.trend.indexOf("상승") !== -1;
      var pillCls = trendPillClass(row.trend);
      var flag = ethicsFlag(row.news);
      var flagHtml = flag
        ? '<div class="row-flag-line"><span class="flag-pill">⚠ ' + escapeHtml(flag) + '</span></div>'
        : "";

      return (
        '<div class="trend-row">' +
          '<div class="row-main">' +
            '<span class="row-keyword">' + escapeHtml(row.keyword) + '</span>' +
            '<span class="source-label">' + sourceLabel(row.source) + '</span>' +
            '<span class="pill ' + pillCls + '">' + (up ? "▲ " : "") + escapeHtml(row.trend) + '</span>' +
          '</div>' +
          flagHtml +
          '<div class="row-sub">' +
            '<span>경쟁도 <b>' + escapeHtml(row.competition) + '</b></span>' +
            '<span class="sep">·</span>' +
            '<span class="row-news">' + escapeHtml(row.news) + '</span>' +
            '<span class="sep">·</span>' +
            '<span class="row-time">' + escapeHtml(row.collectedAt) + '</span>' +
          '</div>' +
        '</div>'
      );
    }).join("");
  }

  function renderTrendError(err) {
    var container = document.getElementById("trend-cards");
    container.innerHTML = '<div class="error-state">데이터를 불러오지 못했습니다: ' +
      escapeHtml(err.message || String(err)) + '</div>';
  }

  function parseDate(str) {
    var t = Date.parse(str.replace(" ", "T"));
    return isNaN(t) ? 0 : t;
  }

  function statusPillClass(status) {
    if (status.indexOf("검수") !== -1) return "pill-warn";
    if (status.indexOf("발행완료") !== -1) return "pill-neutral";
    return "pill-neutral";
  }

  function isPendingStatus(status) {
    return status.indexOf("검수") !== -1;
  }

  function renderBlogRows(rows) {
    var container = document.getElementById("blog-content");

    if (!rows || rows.length === 0) {
      container.innerHTML = '<div class="empty-state">표시할 데이터가 없습니다</div>';
      return;
    }

    var sorted = rows.slice().sort(function (a, b) {
      return parseDate(b.date) - parseDate(a.date);
    });

    var body = sorted.map(function (row) {
      var pillCls = statusPillClass(row.status);
      var rowCls = isPendingStatus(row.status) ? ' class="status-row-pending"' : "";
      return (
        '<tr' + rowCls + '>' +
          '<td>' + escapeHtml(row.date) + '</td>' +
          '<td>' + escapeHtml(row.category) + '</td>' +
          '<td>' + escapeHtml(row.topic) + '</td>' +
          '<td><span class="pill ' + pillCls + '">' + escapeHtml(row.status) + '</span></td>' +
          '<td>' + escapeHtml(row.note) + '</td>' +
        '</tr>'
      );
    }).join("");

    container.innerHTML =
      '<div class="table-wrap">' +
        '<table class="blog-table">' +
          '<thead><tr>' +
            '<th>날짜</th><th>카테고리</th><th>소재</th><th>상태</th><th>비고</th>' +
          '</tr></thead>' +
          '<tbody>' + body + '</tbody>' +
        '</table>' +
      '</div>';
  }

  function renderBlogError(err) {
    var container = document.getElementById("blog-content");
    container.innerHTML = '<div class="error-state">데이터를 불러오지 못했습니다: ' +
      escapeHtml(err.message || String(err)) + '</div>';
  }

  function setLastUpdated() {
    var el = document.getElementById("last-updated");
    el.textContent = new Date().toLocaleString("ko-KR", {
      hour: "2-digit", minute: "2-digit", second: "2-digit"
    });
  }

  // ---------------------------------------------------------------------
  // Main loop
  // ---------------------------------------------------------------------
  function tick() {
    fetchTrendRows()
      .then(function (rows) {
        renderTrendRows(rows);
        setLastUpdated();
      })
      .catch(renderTrendError);

    fetchBlogRows()
      .then(renderBlogRows)
      .catch(renderBlogError);
  }

  document.getElementById("refresh-label").textContent =
    Math.round(CONFIG.REFRESH_MS / 1000) + "초마다 갱신 중";

  tick();
  setInterval(tick, CONFIG.REFRESH_MS);
})();
</script>
</body>
</html>
